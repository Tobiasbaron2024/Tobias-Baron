name: groschen-snapshot
on:
  push:
    branches: [claude/groschen-test]
    paths: [.github/workflows/groschen-snapshot.yml]
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -x
          mkdir -p snap/g snap/s/groschen # run2
          for f in index.html app.js plus.js aktionen.js styles.css theme.css sw.js manifest.webmanifest; do
            curl -sSL "https://groschen-haushaltsbuch.netlify.app/$f?t=$RANDOM" -o "snap/g/$f"
          done
          for f in index.html app.js plus.js aktionen.js styles.css theme.css embedded.css sw.js; do
            curl -sSL "https://shiftly-schichtzettel.netlify.app/groschen/$f?t=$RANDOM" -o "snap/s/groschen/$f"
          done
          for f in index.html app.js aktionen.js calc.js daily-budget.js dashboard-order.js dashboard.js day-greeting.js features.js fold.js lohn2026.js object-rates.js pdf.js periods.js plan-import-core.js plan-import-files.js plan-import.js scenes.js style.css urlaub-mehrfach.js urlaub.js verkauf.js wish-plan.js wishes.js manifest.webmanifest sw.js; do
            curl -sSL "https://shiftly-schichtzettel.netlify.app/$f?t=$RANDOM" -o "snap/s/$f"
          done
          ls -la snap/g snap/s snap/s/groschen
          git config user.name snapshot-bot
          git config user.email snapshot-bot@users.noreply.github.com
          git add snap
          git commit -m "Snapshot Groschen-Dateien" || true
          git push
